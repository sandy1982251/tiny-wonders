<html lang="es">
<head>

      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      background: #f5fbff;
      color: #17324d;
      line-height: 1.6;
    }

    /* NAVBAR */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 14px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.10);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #17324d;
    }

    nav a {
      text-decoration: none;
      color: #17324d;
      margin-left: 20px;
      font-weight: bold;
      transition: 0.2s;
    }

    nav a:hover {
      color: #16a8e0;
    }
